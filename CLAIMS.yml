last_checked: 2026-09-09
recheck_after: 2026-09-16
claims:
  proof_of_work:
    status: live
    summary: Kaspa uses proof of work for Sybil resistance and block production.
    source: https://github.com/kaspanet/rusty-kaspa

  utxo_ledger:
    status: live
    summary: Kaspa tracks spendable transaction outputs; an accepted transaction consumes prior outputs and creates new ones.
    source: https://github.com/kaspanet/rusty-kaspa

  ghostdag:
    status: live
    summary: GHOSTDAG is the consensus rule used to classify and order Kaspa's blockDAG on mainnet.
    source: https://eprint.iacr.org/2018/104
    supporting_source: https://github.com/kaspanet/rusty-kaspa

  crescendo_10_bps:
    status: live
    summary: Crescendo activated at DAA score 110165000 and changed the mainnet target interval to 100 milliseconds, or ten blocks per second.
    source: https://github.com/kaspanet/rusty-kaspa/releases/tag/v1.0.0
    supporting_source: https://github.com/kaspanet/kips/blob/master/kip-0014.md
    forbidden_copy:
      - Kaspa payments are instantly final
      - Ten BPS guarantees ten times faster finality

  network_snapshot:
    status: measurement_sensitive
    recheck_after: 2026-09-07
    summary: At 2026-09-06 10:20 UTC the public endpoints reported DAA score 532696787, 27684582516.56962022 circulating KAS, a 2.18267645 KAS block reward, node v2.0.1, and synced state.
    source: https://api.kaspa.org/info/blockdag
    supporting_source: https://api.kaspa.org/info/coinsupply
    supporting_source_2: https://api.kaspa.org/info/blockreward
    supporting_source_3: https://api.kaspa.org/info/kaspad
    forbidden_copy:
      - API blockCount is a network-wide block total
      - This network snapshot is a permanent constant

  emission_schedule:
    status: live_design
    summary: Kaspa's scheduled issuance steps down every 2629800 seconds of DAA-tracked time by a factor of two to the negative one twelfth; at ten BPS the per-second amount is divided across ten blocks.
    source: https://github.com/kaspanet/rusty-kaspa/blob/master/consensus/src/processes/coinbase.rs
    forbidden_copy:
      - Kaspa has a four-year reward cliff
      - Emission steps are triggered by a calendar date

  scheduled_reward_step:
    status: measurement_sensitive
    recheck_after: 2026-09-07
    summary: At 2026-09-06 10:20 UTC, DAA 532696787 was above threshold 531207000. Schedule index 52 is active at 2.18267645 KAS per block. The next threshold is DAA 557505000 for 2.06017223 KAS per block; clock time remains an estimate.
    source: https://api.kaspa.org/info/halving
    forbidden_copy:
      - The next reward step occurs at an exact wall-clock time

  fair_launch:
    status: narrative_guardrail
    summary: Kaspa mainnet began on 2021-11-07 without a premine, presale, or official founder, investor, company, or foundation allocation; post-launch early mining is a separate distribution question.
    source: https://github.com/kaspanet/rusty-kaspa/blob/master/consensus/core/src/config/genesis.rs
    supporting_source: https://wiki.kaspa.org/prehistory
    forbidden_copy:
      - Fair launch proves equal distribution
      - No core contributor mined early Kaspa

  toccata:
    status: daa_gated
    recheck_after: 2026-09-18
    summary: The v2.0.0 release set Toccata's mainnet activation threshold at DAA score 474165565. The public BlockDAG response checked on 2026-09-06 was above that threshold; KIP-16, KIP-17, KIP-20, and KIP-21 read Active, while tool and product support remain separate claims.
    source: https://github.com/kaspanet/rusty-kaspa/releases/tag/v2.0.0
    supporting_source: https://api.kaspa.org/info/blockdag
    supporting_source_2: https://github.com/kaspanet/kips
    forbidden_copy:
      - Toccata is still pending
      - Active Toccata rules prove mature applications exist
      - Testnet evidence proves mainnet activation

  silverscript:
    status: builder_guardrail
    recheck_after: 2026-09-18
    summary: Silverscript v1.0.0 is the tagged official v1 language and compiler release (9 Sep 2026). A compiler tag does not establish production applications.
    source: https://github.com/kaspanet/silverscript/releases/tag/v1.0.0
    supporting_source: https://github.com/kaspanet/silverscript
    forbidden_copy:
      - Silverscript v1-rc1 is the current release
      - A Silverscript compiler tag proves production applications exist
      - Silverscript is production-ready applications

  argent:
    status: builder_guardrail
    recheck_after: 2026-09-11
    summary: Argent contains compiler, artifact, runtime, and example code; its repository says it is not release-ready and requires further auditing and hardening.
    source: https://github.com/argent-lang/argent
    supporting_source: https://github.com/argent-lang/argent/releases
    forbidden_copy:
      - Argent is production-ready
      - Argent has a stable release

  vprogs:
    status: research
    recheck_after: 2026-09-11
    summary: The vProgs repository describes early development and has no tagged release; it does not establish a live Kaspa application layer.
    source: https://github.com/kaspanet/vprogs
    supporting_source: https://github.com/kaspanet/vprogs/releases
    forbidden_copy:
      - vProgs is live on Kaspa mainnet

  dagknight:
    status: research
    recheck_after: 2026-09-11
    summary: KIP-2 remains Proposed; development branch work exists; no mainnet activation is documented in the checked KIP or node releases. Mainnet uses GHOSTDAG.
    source: https://raw.githubusercontent.com/kaspanet/kips/master/kip-0002.md
    supporting_source: https://github.com/kaspanet/rusty-kaspa/commit/90e406f8a7c692b171294d8d26b0f83eff530a60
    forbidden_copy:
      - DAGKnight is live on mainnet
      - DAGKnight has an activation date

  kcc_status:
    status: measurement_sensitive
    recheck_after: 2026-09-11
    summary: Four KCCs are merged. KCC-0000 is Last Call; KCC-0001, KCC-0002, and KCC-0020 are Draft. KCC-0020 issue 14 remains open.
    source: https://github.com/kaspanet/kccs/blob/main/kcc-0000.md
    supporting_source: https://github.com/kaspanet/kccs/blob/main/kcc-0001.md
    supporting_source_2: https://github.com/kaspanet/kccs/blob/main/kcc-0002.md
    supporting_source_3: https://github.com/kaspanet/kccs/blob/main/kcc-0020.md
    supporting_source_4: https://github.com/kaspanet/kccs/issues/14
    forbidden_copy:
      - KCC-0020 is a ratified token standard
      - A merged KCC changes consensus

  throughput_context:
    status: narrative_guardrail
    summary: Throughput claims require a transaction shape, block-mass assumptions, and a distinction between capacity, observed use, and confirmation confidence.
    source: https://github.com/kaspanet/kips/blob/master/kip-0009.md
    supporting_source: https://github.com/kaspanet/rusty-kaspa/blob/master/consensus/core/src/mass/mod.rs
    forbidden_copy:
      - Kaspa currently does 30000 TPS
      - A testnet TPS result is normal mainnet use
      - ZK proofs make throughput unlimited
