name: Publish testnet applications
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run setup:testnet
      - name: Check out pinned contract VM source
        uses: actions/checkout@v6
        with:
          repository: kaspanet/silverscript
          ref: c7d17a15ac88610d013ec9ffffa9520aeb69929b
          path: .cache/upstream/silverscript
          persist-credentials: false
      - name: Install verified Rust toolchain
        run: rustup toolchain install 1.97.0 --profile minimal && rustup default 1.97.0
      - run: node scripts/build-public-templates.mjs --check-vm
      - run: node scripts/public-token-fixtures.mjs --check-vm
      - run: node scripts/public-receipt-fixtures.mjs --check-vm
      - name: Check world contracts with unfunded native VM fixtures
        run: npm run check:v4:vm
      - run: npm run check
      - name: Check world recovery, protocol and model boundaries
        run: npm run check:v4
      - name: Check complete economy and repeat-order recovery without spending
        run: npm run check:v4:flows
      - run: npm run check:public
      - run: npm run check:faucet
      - run: npm run check:public:browser
      - run: npm run check:copy
      - run: npm run check:posts
      - run: npm run check:v1
      - run: npm run check:guided
      - run: npm run check:journeys
      - run: KASPA_RELEASE=v2 npm run check:render
      - name: Check the shipped world without a wallet or transaction
        run: |
          node --input-type=module <<'JS'
          import {chromium, firefox, webkit} from 'playwright';
          import assert from 'node:assert/strict';
          import {readFile, mkdir} from 'node:fs/promises';
          import {resolve, dirname} from 'node:path';
          import {staticPreview} from './scripts/static-preview.mjs';
          const visited=new Set();
          async function imports(file){
            if(visited.has(file))return;
            visited.add(file);
            const source=await readFile(file,'utf8');
            for(const match of source.matchAll(/(?:from\s*|import\s*\()\s*['"](\.[^'"]+)['"]/g))await imports(resolve(dirname(file),match[1]));
          }
          await imports(resolve('dist/assets/public-apps.mjs'));
          const server=staticPreview('dist');
          await new Promise(resolve=>server.listen(0,'127.0.0.1',resolve));
          await mkdir('.cache/visual-review/v4-ci',{recursive:true});
          try{
            for(const engine of [chromium,firefox,webkit]){
              const browser=await engine.launch();
              try{
                for(const width of [390,1440]){
                  const context=await browser.newContext({viewport:{width,height:900},reducedMotion:'reduce'});
                  const page=await context.newPage(),errors=[],faucet=[];
                  page.on('pageerror',error=>errors.push(error.message));
                  await context.route('**/api/faucet',route=>{faucet.push(route.request().url());return route.abort();});
                  await page.goto(`http://127.0.0.1:${server.address().port}/covenants/`);
                  await page.locator('[data-game-continue]').waitFor();
                  assert.match(await page.locator('[data-game-continue]').textContent(),/Create my test wallet/);
                  await page.locator('[data-game-menu] > summary').click();
                  await page.locator('[data-game-about]').click();
                  assert.equal(await page.locator('.v4-about-dialog').evaluate(el=>el.open),true);
                  await page.locator('[data-game-close-about]').click();
                  assert.equal(await page.evaluate(()=>document.documentElement.scrollWidth>innerWidth+1),false);
                  assert.deepEqual(errors,[]);
                  assert.deepEqual(faucet,[]);
                  await page.screenshot({path:`.cache/visual-review/v4-ci/${engine.name()}-${width}.png`,fullPage:true});
                  await context.close();
                }
              }finally{await browser.close();}
            }
          }finally{await new Promise(resolve=>server.close(resolve));}
          console.log(`World welcome, disclosure and ${visited.size} shipped modules checked; no wallet created.`);
          JS
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy verified static artifact
        id: deployment
        uses: actions/deploy-pages@v4
